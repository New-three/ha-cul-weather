name: Publish integration release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - "custom_components/cul_weather/manifest.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Determine version
        id: version
        shell: bash
        run: |
          VERSION="$(jq -r '.version' custom_components/cul_weather/manifest.json)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected manifest version: $VERSION" >&2
            exit 1
          fi
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Publish release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "CUL Weather $TAG" \
            --notes-file CHANGELOG.md
